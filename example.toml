# Logger verbosity (slog level). -8 is debug; 0 is info.
log_level = -8

# Cron expression for scheduled runs (e.g. "@daily", "0 30 2 * * *").
# Empty string = run once and exit. On each cron tick the config file is
# reloaded, so recipient/bill/SMTP edits apply without restarting.
cron_job = "@daily"

# Seconds to wait between bill ID API calls (rate limiting).
wait_time = 120

# Optional. How long to keep on-disk sent-outage cache files (Go duration).
# Defaults to 168h (7 days) when omitted.
# delete_duration_period = "168h"

# Bearer token from https://uiapi.saapa.ir
auth_token = ""


[smtp.gmail]
mail = ""
from = ""
host = "smtp.gmail.com"
port = "587"
username = ""
password = ""
auth_method = "plain"
identity = ""
skip_tls = true
# transport = "smtp"   # default; use "ews" for Exchange Web Services over HTTPS

# Optional: route SMTP through a SOCKS5 proxy.
# Remove or leave host empty to connect directly.
# [smtp.gmail.proxy]
# host = "127.0.0.1"
# port = "1080"
# username = ""   # leave empty if proxy requires no auth
# password = ""

# Optional: for on-prem Exchange accounts, mail can be delivered over
# Exchange Web Services (HTTPS/443) instead of raw SMTP (port 25). Useful
# when the SMTP port is blocked/throttled but EWS/OWA is reachable.
# [smtp.exchange]
# mail = ""
# from = ""
# host = "mail.example.com"       # used to build https://<host>/EWS/Exchange.asmx
# username = "DOMAIN\\user"       # NTLM credentials
# password = ""
# transport = "ews"
# skip_tls = false
# ews_url = ""                    # optional override of the default EWS endpoint

[clients.my_client]
# Must match the [smtp.<name>] table key above (e.g. "gmail").
smtp = "gmail"

# Prefer bill_ids for one or more bills. bill_id alone still works.
bill_id = ""
bill_ids = [""]

# Recipients of calendar invites. When cron_job is set, adding addresses
# here only emails the newcomers for already-known outages; same-day
# outage time changes send an update to everyone currently listed.
recipients = [""]
